<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Product | Advance Billing System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #1e293b; }
        .form-card { border: none; border-radius: 24px; box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08); background: #ffffff; }
        .header-badge { width: 52px; height: 52px; background: #eff6ff; color: #2563eb; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; font-size: 1.4rem; margin-bottom: 1rem; }
        .form-control { border-radius: 12px; padding: 11px 16px; border: 1px solid #cbd5e1; background-color: #f8fafc; font-size: 0.95rem; transition: all 0.2s ease; }
        .form-control:focus { background-color: #ffffff; border-color: #2563eb; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12); }
        .input-group-text { border-radius: 12px 0 0 12px; background-color: #f1f5f9; border: 1px solid #cbd5e1; border-right: none; color: #64748b; }
        .input-group .form-control { border-radius: 0 12px 12px 0; }
        .btn-submit { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); border: none; border-radius: 14px; padding: 12px; font-weight: 600; box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.35); transition: all 0.2s ease; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 14px 24px -5px rgba(37, 99, 235, 0.45); }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="card form-card p-4 p-md-5" style="max-width: 480px; width: 100%;">
        <div class="text-center mb-4">
            <div class="header-badge">
                <i class="fa-solid fa-boxes-stacked"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">Add New Product</h3>
            <p class="text-muted small mb-0">Expand your inventory items for seamless billing</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show rounded-4 small py-2 shadow-sm border-0 mb-4" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
            <!-- Product Name -->
            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary small">Product Name</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-tag"></i></span>
                    <input type="text" name="name" class="form-control" placeholder="Enter product name" required>
                </div>
            </div>

            <!-- Price -->
            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary small">Price (₹)</label>
                <div class="input-group">
                    <span class="input-group-text fw-bold">₹</span>
                    <input type="number" step="0.01" name="price" class="form-control fw-semibold" placeholder="0.00" required>
                </div>
            </div>

            <!-- Stock Quantity -->
            <div class="mb-4">
                <label class="form-label fw-semibold text-secondary small">Stock Quantity</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-layer-group"></i></span>
                    <input type="number" name="stock" class="form-control" placeholder="Enter stock quantity" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-submit w-100 text-white mb-3">
                <i class="fa-solid fa-plus-circle me-2"></i> Add Product to Inventory
            </button>
        </form>

        <div class="text-center">
            <a href="{% url 'dashboard' %}" class="text-decoration-none text-muted small fw-medium">
                <i class="fa-solid fa-arrow-left me-1"></i> Back to Dashboard
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
