<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Product | Advance Billing System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
        }
        .main-card {
            border: none;
            border-radius: 24px;
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08);
            background: #ffffff;
        }
        .header-badge {
            width: 48px;
            height: 48px;
            background: #eff6ff;
            color: #2563eb;
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }
        .form-control {
            border-radius: 12px;
            padding: 10px 16px;
            border: 1px solid #cbd5e1;
            background-color: #f8fafc;
            font-size: 0.95rem;
        }
        .form-control:focus {
            background-color: #ffffff;
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }
        .btn-custom {
            border-radius: 12px;
            padding: 10px 18px;
            font-weight: 600;
            font-size: 0.9rem;
        }
    </style>
</head>
<body class="py-5">
    <div class="container" style="max-width: 680px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="d-flex align-items-center gap-3">
                <div class="header-badge shadow-sm">
                    <i class="fa-solid fa-pen-to-square"></i>
                </div>
                <div>
                    <h3 class="fw-bold text-dark mb-0">Update Product</h3>
                    <p class="text-muted small mb-0">Editing <strong>{{ product.name }}</strong></p>
                </div>
            </div>
            <a href="{% url 'product_list' %}" class="btn btn-outline-secondary btn-custom bg-white shadow-sm">
                <i class="fa-solid fa-arrow-left me-1"></i> Back to List
            </a>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show rounded-4 shadow-sm border-0 mb-4" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        <div class="card main-card p-4 p-md-5">
            <form method="POST">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold small">Product Name</label>
                        <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold small">Category</label>
                        <input type="text" name="category" class="form-control" value="{{ product.category|default:'' }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold small">Price (₹)</label>
                        <input type="number" step="0.01" name="price" class="form-control" value="{{ product.price }}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold small">Stock</label>
                        <input type="number" name="stock" class="form-control" value="{{ product.stock }}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold small">GST Rate (%)</label>
                        <input type="number" step="0.01" name="gst_rate" class="form-control" value="{{ product.gst_rate }}">
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                    <a href="{% url 'product_list' %}" class="btn btn-light btn-custom border px-4">Cancel</a>
                    <button type="submit" class="btn btn-primary btn-custom px-4 shadow-sm">
                        <i class="fa-solid fa-check me-1"></i> Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
