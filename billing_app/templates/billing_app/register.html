<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Advance Billing System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1d4ed8;
            --primary-hover: #1e40af;
            --primary-soft: #eff6ff;
            --surface: #ffffff;
            --bg-canvas: #f8fafc;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --focus-ring: rgba(29, 78, 216, 0.14);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-canvas);
            background-image:
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.10) 0px, transparent 50%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            color: var(--text-primary);
        }

        .register-container {
            width: 100%;
            max-width: 440px;
        }

        .register-card {
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 32px 28px;
            box-shadow:
                0 10px 25px -5px rgba(15, 23, 42, 0.06),
                0 4px 10px -6px rgba(15, 23, 42, 0.04);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 22px;
        }

        .brand-logo {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: var(--primary-soft);
            color: var(--primary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-bottom: 14px;
            border: 1px solid rgba(29, 78, 216, 0.12);
        }

        .brand-title {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 0 0 6px;
            color: var(--text-primary);
        }

        .brand-subtitle {
            font-size: 0.86rem;
            color: var(--text-secondary);
            margin: 0;
        }

        .field-group {
            margin-bottom: 15px;
        }

        .field-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .field-tag {
            font-size: 0.72rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .leading-icon {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 0.88rem;
            pointer-events: none;
            transition: color 0.2s ease;
        }

        .form-input {
            width: 100%;
            height: 44px;
            padding: 0 42px 0 40px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-primary);
            background-color: #ffffff;
            border: 1.5px solid var(--border-color);
            border-radius: 11px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        .form-input:hover {
            border-color: #cbd5e1;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3.5px var(--focus-ring);
        }

        .input-wrapper:focus-within .leading-icon {
            color: var(--primary);
        }

        .trailing-btn {
            position: absolute;
            right: 10px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            width: 30px;
            height: 30px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .trailing-btn:hover {
            background-color: #f1f5f9;
            color: var(--text-primary);
        }

        .strength-bar-wrap {
            height: 4px;
            background: #e2e8f0;
            border-radius: 99px;
            overflow: hidden;
            margin-top: 8px;
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            border-radius: 99px;
            transition: width 0.25s ease, background-color 0.25s ease;
        }

        .strength-text {
            font-size: 0.74rem;
            color: var(--text-muted);
            margin-top: 5px;
            display: block;
        }

        .btn-submit {
            width: 100%;
            height: 45px;
            margin-top: 6px;
            border: none;
            border-radius: 11px;
            background-color: var(--primary);
            color: #ffffff;
            font-size: 0.92rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.12s ease, box-shadow 0.2s ease;
        }

        .btn-submit:hover:not(:disabled) {
            background-color: var(--primary-hover);
            box-shadow: 0 8px 18px -6px rgba(29, 78, 216, 0.45);
        }

        .btn-submit:active:not(:disabled) {
            transform: scale(0.99);
        }

        .btn-submit:disabled {
            opacity: 0.75;
            cursor: not-allowed;
        }

        .card-footer-links {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #f1f5f9;
            text-align: center;
        }

        .signin-text {
            font-size: 0.84rem;
            color: var(--text-secondary);
            margin: 0;
        }

        .signin-text a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }

        .signin-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main class="register-container">
        <section class="register-card" aria-label="Registration form">
            <div class="brand-header">
                <div class="brand-logo">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h1 class="brand-title">Create your account</h1>
                <p class="brand-subtitle">Register as a distributor to start billing</p>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show rounded-3 py-2 px-3 small mb-3" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close btn-close-sm" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" id="registerForm" novalidate>
                {% csrf_token %}

                <div class="field-group">
                    <label for="nameInput" class="field-label">
                        <span>Full Name</span>
                    </label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user leading-icon"></i>
                        <input
                            type="text"
                            id="nameInput"
                            name="name"
                            class="form-input"
                            placeholder="Yashavant Kalsariya"
                            autocomplete="name"
                            autofocus
                            required
                        >
                    </div>
                </div>

                <div class="field-group">
                    <label for="emailInput" class="field-label">
                        <span>Email Address</span>
                        <span class="field-tag">Primary Login</span>
                    </label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope leading-icon"></i>
                        <input
                            type="email"
                            id="emailInput"
                            name="email"
                            class="form-input"
                            placeholder="name@example.com"
                            autocomplete="email"
                            required
                        >
                    </div>
                </div>

                <div class="field-group">
                    <label for="phoneInput" class="field-label">
                        <span>Mobile Number</span>
                        <span class="field-tag">Secondary Login</span>
                    </label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-mobile-screen-button leading-icon"></i>
                        <input
                            type="tel"
                            id="phoneInput"
                            name="phone"
                            class="form-input"
                            placeholder="9876543210"
                            maxlength="15"
                            autocomplete="tel"
                            required
                        >
                    </div>
                </div>

                <div class="field-group">
                    <label for="passwordInput" class="field-label">
                        <span>Password</span>
                        <span class="field-tag">Min 6 chars</span>
                    </label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock leading-icon"></i>
                        <input
                            type="password"
                            id="passwordInput"
                            name="password"
                            class="form-input"
                            placeholder="Create a strong password"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >
                        <button
                            type="button"
                            class="trailing-btn"
                            id="togglePasswordBtn"
                            aria-label="Show or hide password"
                        >
                            <i class="fa-regular fa-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                    <div class="strength-bar-wrap">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                    <span class="strength-text" id="strengthText">Use at least 6 characters</span>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <span id="submitBtnText">Create Account</span>
                    <i class="fa-solid fa-arrow-right small" id="submitBtnIcon"></i>
                </button>
            </form>

            <div class="card-footer-links">
                <p class="signin-text">
                    Already have an account? <a href="{% url 'login' %}">Sign In</a>
                </p>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function () {
            const toggleBtn = document.getElementById("togglePasswordBtn");
            const passwordInput = document.getElementById("passwordInput");
            const toggleIcon = document.getElementById("togglePasswordIcon");
            const strengthBar = document.getElementById("strengthBar");
            const strengthText = document.getElementById("strengthText");
            const phoneInput = document.getElementById("phoneInput");
            const registerForm = document.getElementById("registerForm");
            const submitBtn = document.getElementById("submitBtn");
            const submitBtnText = document.getElementById("submitBtnText");
            const submitBtnIcon = document.getElementById("submitBtnIcon");

            if (toggleBtn && passwordInput && toggleIcon) {
                toggleBtn.addEventListener("click", function () {
                    const shouldShow = passwordInput.type === "password";
                    passwordInput.type = shouldShow ? "text" : "password";
                    toggleIcon.className = shouldShow ? "fa-regular fa-eye-slash" : "fa-regular fa-eye";
                });
            }

            if (phoneInput) {
                phoneInput.addEventListener("input", function () {
                    phoneInput.value = phoneInput.value.replace(/[^\d+\s-]/g, "");
                });
            }

            if (passwordInput && strengthBar && strengthText) {
                passwordInput.addEventListener("input", function () {
                    const val = passwordInput.value;
                    let score = 0;
                    if (val.length >= 6) score++;
                    if (val.length >= 9) score++;
                    if (/[A-Z]/.test(val) && /[0-9]/.test(val)) score++;
                    if (/[^A-Za-z0-9]/.test(val)) score++;

                    if (!val) {
                        strengthBar.style.width = "0%";
                        strengthText.textContent = "Use at least 6 characters";
                        strengthText.style.color = "#94a3b8";
                    } else if (val.length < 6) {
                        strengthBar.style.width = "25%";
                        strengthBar.style.backgroundColor = "#ef4444";
                        strengthText.textContent = "Too short (minimum 6 characters)";
                        strengthText.style.color = "#dc2626";
                    } else if (score <= 2) {
                        strengthBar.style.width = "60%";
                        strengthBar.style.backgroundColor = "#f59e0b";
                        strengthText.textContent = "Fair password — add numbers or symbols to strengthen";
                        strengthText.style.color = "#d97706";
                    } else {
                        strengthBar.style.width = "100%";
                        strengthBar.style.backgroundColor = "#10b981";
                        strengthText.textContent = "Strong password";
                        strengthText.style.color = "#059669";
                    }
                });
            }

            if (registerForm && submitBtn) {
                registerForm.addEventListener("submit", function () {
                    submitBtn.disabled = true;
                    if (submitBtnText) submitBtnText.textContent = "Creating account...";
                    if (submitBtnIcon) submitBtnIcon.className = "fa-solid fa-circle-notch fa-spin small";
                });
            }
        })();
    </script>
</body>
</html>
