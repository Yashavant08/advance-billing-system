<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if mode == 'edit' %}Edit Product{% else %}Add Product{% endif %} | Advance Billing System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .form-card { border: none; border-radius: 22px; box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08); }
        .form-control { border-radius: 12px; padding: 10px 14px; border: 1px solid #cbd5e1; background-color: #f8fafc; font-size: 0.95rem; }
        .form-control:focus { background-color: #ffffff; border-color: #2563eb; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12); }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5 px-3">

<div class="card form-card p-4 p-md-5 bg-white" style="max-width: 520px; width: 100%;">
    <div class="mb-4">
        <h3 class="fw-bold text-dark mb-1">{% if mode == 'edit' %}Update Product{% else %}Add New Product{% endif %}</h3>
        <p class="text-muted small mb-0">Enter valid pricing and non-negative stock details</p>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %} rounded-4 py-2 px-3 small">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="post" novalidate>
        {% csrf_token %}
        <div class="mb-3">
            <label for="id_name" class="form-label fw-semibold small">Product Name *</label>
            <input type="text" id="id_name" name="name" value="{{ form_data.name|default:product.name|default:'' }}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="id_category" class="form-label fw-semibold small">Category</label>
            <input type="text" id="id_category" name="category" value="{{ form_data.category|default:product.category|default:'' }}" class="form-control" placeholder="e.g. Grocery, Electronics">
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <label for="id_price" class="form-label fw-semibold small">Price (₹) *</label>
                <input type="number" step="0.01" min="0" id="id_price" name="price" value="{{ form_data.price|default:product.price|default:'' }}" class="form-control" required>
            </div>
            <div class="col-md-4">
                <label for="id_stock" class="form-label fw-semibold small">Stock *</label>
                <input type="number" step="1" min="0" id="id_stock" name="stock" value="{{ form_data.stock|default:product.stock|default:'' }}" class="form-control" required>
            </div>
            <div class="col-md-4">
                <label for="id_gst_rate" class="form-label fw-semibold small">GST Rate (%)</label>
                <input type="number" step="0.01" min="0" max="100" id="id_gst_rate" name="gst_rate" value="{{ form_data.gst_rate|default:product.gst_rate|default:'0.00' }}" class="form-control">
            </div>
        </div>

        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary rounded-pill py-2 fw-semibold">
                {% if mode == 'edit' %}Save Changes{% else %}Add Product{% endif %}
            </button>
            <a href="{% url 'product_list' %}" class="btn btn-outline-secondary rounded-pill py-2 fw-semibold">Cancel</a>
        </div>
    </form>
</div>

</body>
</html>
