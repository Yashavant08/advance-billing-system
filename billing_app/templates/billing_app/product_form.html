<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% if mode == 'edit' %}Edit Product{% else %}Add Product{% endif %} | Advance Billing System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .form-card { border: none; border-radius: 22px; box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08); }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">

<div class="card form-card p-4 p-md-5 bg-white" style="max-width: 500px; width: 100%;">
    <div class="mb-4">
        <h3 class="fw-bold text-dark mb-1">{% if mode == 'edit' %}Update Product{% else %}Add New Product{% endif %}</h3>
        <p class="text-muted small mb-0">Enter valid pricing and non-negative stock details</p>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %} rounded-4 py-2 px-3">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label fw-semibold small">Product Name *</label>
            <input type="text" name="name" value="{{ form_data.name }}" class="form-control rounded-3" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold small">Category</label>
            <input type="text" name="category" value="{{ form_data.category }}" class="form-control rounded-3" placeholder="e.g. Grocery, Electronics">
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <label class="form-label fw-semibold small">Price (₹) *</label>
                <input type="number" step="0.01" min="0.01" name="price" value="{{ form_data.price }}" class="form-control rounded-3" required>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold small">Stock *</label>
                <input type="number" step="1" min="0" name="stock" value="{{ form_data.stock }}" class="form-control rounded-3" required>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold small">GST Rate (%)</label>
                <input type="number" step="0.01" min="0" max="100" name="gst_rate" value="{{ form_data.gst_rate }}" class="form-control rounded-3">
            </div>
        </div>

        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary rounded-pill py-2 fw-semibold">
                {% if mode == 'edit' %}Save Changes{% else %}Add Product{% endif %}
            </button>
            <a href="{% url 'product_list' %}" class="btn btn-outline-secondary rounded-pill py-2 fw-semibold">Cancel</a>
        </div>
    </form>
</div>

</body>
</html>
