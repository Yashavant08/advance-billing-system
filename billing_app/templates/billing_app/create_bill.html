<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Bill | Advance Billing System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .form-card { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); background: #ffffff; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="card form-card p-4 p-md-5" style="max-width: 450px; width: 100%;">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-dark">Generate Bill & QR</h3>
            <p class="text-muted small">Enter customer details to generate instant payment QR</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show rounded-4 small py-2" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-medium text-secondary small">Customer Name</label>
                <input type="text" name="customer_name" class="form-control rounded-pill py-2 px-3" placeholder="Enter customer name" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-medium text-secondary small">Customer Phone</label>
                <input type="text" name="customer_phone" class="form-control rounded-pill py-2 px-3" placeholder="Enter phone number" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-medium text-secondary small">Total Amount (₹)</label>
                <input type="number" step="0.01" name="total_amount" class="form-control rounded-pill py-2 px-3" placeholder="0.00" required>
            </div>
            <button type="submit" class="btn btn-success w-100 rounded-pill py-2 fw-semibold mb-3">Generate Bill & QR Code</button>
        </form>

        <div class="text-center">
            <a href="{% url 'dashboard' %}" class="text-decoration-none text-muted small fw-medium">← Back to Dashboard</a>
        </div>
    </div>

</body>
</html>
