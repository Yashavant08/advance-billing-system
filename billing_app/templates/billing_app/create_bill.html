<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Bill | Advance Billing System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
        }
        .form-card {
            border: none;
            border-radius: 24px;
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08);
            background: #ffffff;
        }
        .header-badge {
            width: 52px;
            height: 52px;
            background: #ecfdf5;
            color: #059669;
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            margin-bottom: 0.75rem;
        }
        .form-control, .form-select {
            border-radius: 12px;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            background-color: #f8fafc;
            font-size: 0.92rem;
            transition: all 0.2s ease;
        }
        .form-control:focus, .form-select:focus {
            background-color: #ffffff;
            border-color: #10b981;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.12);
        }
        .input-group-text {
            border-radius: 12px 0 0 12px;
            background-color: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-right: none;
            color: #64748b;
        }
        .input-group .form-control {
            border-radius: 0 12px 12px 0;
        }
        .item-row {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 14px;
        }
        .summary-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px 20px;
        }
        .btn-generate {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            border: none;
            border-radius: 14px;
            padding: 12px;
            font-weight: 600;
            box-shadow: 0 10px 20px -5px rgba(16, 185, 129, 0.35);
            transition: all 0.2s ease;
        }
        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 24px -5px rgba(16, 185, 129, 0.45);
        }
    </style>
</head>
<body class="py-5">

    <div class="container" style="max-width: 800px;">
        <div class="card form-card p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="header-badge">
                    <i class="fa-solid fa-file-invoice-dollar"></i>
                </div>
                <h3 class="fw-bold text-dark mb-1">Create Invoice &amp; Bill</h3>
                <p class="text-muted small mb-0">Add customer details and select products with quantities</p>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show rounded-4 small py-2 shadow-sm border-0 mb-4" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" id="billForm">
                {% csrf_token %}

                <!-- Customer Details -->
                <h6 class="fw-bold text-dark mb-3">
                    <i class="fa-solid fa-address-card text-success me-1"></i> Customer Details
                </h6>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold text-secondary small">Customer Name</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                            <input type="text" name="customer_name" class="form-control" placeholder="Enter customer name" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold text-secondary small">Customer Phone</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-phone"></i></span>
                            <input type="text" name="customer_phone" class="form-control" placeholder="Enter phone number" required>
                        </div>
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-semibold text-secondary small">Customer Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-location-dot"></i></span>
                            <input type="text" name="customer_address" class="form-control" placeholder="Enter customer address">
                        </div>
                    </div>
                </div>

                <!-- Line Items Section -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h6 class="fw-bold text-dark mb-0">
                        <i class="fa-solid fa-boxes-stacked text-success me-1"></i> Invoice Items
                    </h6>
                    <button type="button" class="btn btn-sm btn-outline-success rounded-pill px-3 fw-semibold" id="addItemBtn">
                        <i class="fa-solid fa-plus me-1"></i> Add Item
                    </button>
                </div>

                <div id="itemsContainer" class="d-flex flex-column gap-3 mb-4">
                    <div class="item-row">
                        <div class="row g-2 align-items-end">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold text-secondary small mb-1">Product</label>
                                <select name="product_id" class="form-select product-select" required>
                                    <option value="" data-price="0" data-gst="0" data-stock="0">-- Select Product --</option>
                                    {% for product in products %}
                                        <option value="{{ product.pk }}"
                                                data-price="{{ product.price }}"
                                                data-gst="{{ product.gst_rate }}"
                                                data-stock="{{ product.stock }}">
                                            {{ product.name }} (₹{{ product.price }} | Stock: {{ product.stock }})
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold text-secondary small mb-1">Quantity</label>
                                <input type="number" name="quantity" class="form-control qty-input" min="1" value="1" required>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label fw-semibold text-secondary small mb-1">Line Total</label>
                                <div class="fw-bold text-dark py-2 line-total">₹0.00</div>
                            </div>
                            <div class="col-md-1 text-end">
                                <button type="button" class="btn btn-sm btn-outline-danger rounded-3 remove-item-btn" title="Remove item">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Live Summary -->
                <div class="summary-box mb-4">
                    <div class="d-flex justify-content-between small text-secondary mb-1">
                        <span>Subtotal</span>
                        <span id="subtotalDisplay" class="fw-semibold text-dark">₹0.00</span>
                    </div>
                    <div class="d-flex justify-content-between small text-secondary mb-2">
                        <span>Estimated GST</span>
                        <span id="gstDisplay" class="fw-semibold text-dark">₹0.00</span>
                    </div>
                    <hr class="my-2">
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="fw-bold text-dark">Grand Total</span>
                        <span id="grandTotalDisplay" class="fs-5 fw-bold text-success">₹0.00</span>
                    </div>
                </div>

                <button type="submit" class="btn btn-success btn-generate w-100 text-white mb-3">
                    <i class="fa-solid fa-check-circle me-2"></i> Generate Invoice
                </button>
            </form>

            <div class="text-center">
                <a href="{% url 'dashboard' %}" class="text-decoration-none text-muted small fw-medium">
                    <i class="fa-solid fa-arrow-left me-1"></i> Back to Dashboard
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const itemsContainer = document.getElementById('itemsContainer');
        const addItemBtn = document.getElementById('addItemBtn');

        function recalculateBill() {
            let subtotal = 0;
            let totalGst = 0;

            document.querySelectorAll('#itemsContainer .item-row').forEach(row => {
                const select = row.querySelector('.product-select');
                const qtyInput = row.querySelector('.qty-input');
                const lineTotalEl = row.querySelector('.line-total');

                const selectedOption = select.options[select.selectedIndex];
                const price = parseFloat(selectedOption?.dataset.price || 0);
                const gstRate = parseFloat(selectedOption?.dataset.gst || 0);
                const qty = Math.max(0, parseInt(qtyInput.value || 0, 10));

                const lineSub = price * qty;
                const lineGst = (lineSub * gstRate) / 100;
                const lineGrand = lineSub + lineGst;

                subtotal += lineSub;
                totalGst += lineGst;

                lineTotalEl.textContent = '₹' + lineGrand.toFixed(2);
            });

            document.getElementById('subtotalDisplay').textContent = '₹' + subtotal.toFixed(2);
            document.getElementById('gstDisplay').textContent = '₹' + totalGst.toFixed(2);
            document.getElementById('grandTotalDisplay').textContent = '₹' + (subtotal + totalGst).toFixed(2);
        }

        addItemBtn.addEventListener('click', function () {
            const firstRow = itemsContainer.querySelector('.item-row');
            const newRow = firstRow.cloneNode(true);

            newRow.querySelector('.product-select').selectedIndex = 0;
            newRow.querySelector('.qty-input').value = 1;
            newRow.querySelector('.line-total').textContent = '₹0.00';

            itemsContainer.appendChild(newRow);
            recalculateBill();
        });

        itemsContainer.addEventListener('change', function (e) {
            if (e.target.classList.contains('product-select') || e.target.classList.contains('qty-input')) {
                recalculateBill();
            }
        });

        itemsContainer.addEventListener('input', function (e) {
            if (e.target.classList.contains('qty-input')) {
                recalculateBill();
            }
        });

        itemsContainer.addEventListener('click', function (e) {
            const removeBtn = e.target.closest('.remove-item-btn');
            if (!removeBtn) return;

            const rows = itemsContainer.querySelectorAll('.item-row');
            if (rows.length > 1) {
                removeBtn.closest('.item-row').remove();
                recalculateBill();
            } else {
                const row = rows[0];
                row.querySelector('.product-select').selectedIndex = 0;
                row.querySelector('.qty-input').value = 1;
                recalculateBill();
            }
        });

        recalculateBill();
    </script>
</body>
</html>
