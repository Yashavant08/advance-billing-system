<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Advance Billing System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
    <div class="container" style="max-width: 440px;">
        <div class="card border-0 shadow-sm rounded-4 p-4">
            <h4 class="fw-bold mb-1">Forgot Admin Password</h4>
            <p class="text-muted small mb-3">Enter your registered admin email or username to receive an OTP.</p>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} small py-2">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="email" class="form-label small fw-semibold">Admin Email or Username</label>
                    <input type="text" id="email" name="email" class="form-control" placeholder="admin@example.com" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-semibold">Send OTP</button>
            </form>

            <div class="text-center mt-3">
                <a href="{% url 'login' %}" class="text-decoration-none small text-muted">&larr; Back to Login</a>
            </div>
        </div>
    </div>
</body>
</html>
