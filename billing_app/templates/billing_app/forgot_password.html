<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password | Advance Billing System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .auth-card { border: none; border-radius: 22px; box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08); }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">

<div class="card auth-card p-4 p-md-5 bg-white" style="max-width: 450px; width: 100%;">
    <h3 class="fw-bold text-dark mb-1">Forgot Password</h3>
    <p class="text-muted small mb-4">Enter your registered email to receive a 6-digit OTP</p>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %} rounded-4 py-2 px-3">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            <label class="form-label fw-semibold small">Registered Email *</label>
            <input type="email" name="email" value="{{ email }}" class="form-control rounded-3" placeholder="you@example.com" required>
        </div>
        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary rounded-pill py-2 fw-semibold">Send OTP</button>
            <a href="{% url 'login' %}" class="btn btn-outline-secondary rounded-pill py-2 fw-semibold">Back to Login</a>
        </div>
    </form>
</div>

</body>
</html>
