<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Customer | Advance Billing System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1d4ed8;
            --primary-hover: #1e40af;
            --primary-soft: #eff6ff;
            --surface: #ffffff;
            --bg-canvas: #f8fafc;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --focus-ring: rgba(29, 78, 216, 0.14);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-canvas);
            background-image:
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.10) 0px, transparent 50%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            color: var(--text-primary);
        }

        .form-container { width: 100%; max-width: 480px; }

        .form-card {
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 32px 28px;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.06), 0 4px 10px -6px rgba(15, 23, 42, 0.04);
        }

        .brand-header { text-align: center; margin-bottom: 22px; }

        .brand-logo {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: var(--primary-soft);
            color: var(--primary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-bottom: 12px;
            border: 1px solid rgba(29, 78, 216, 0.12);
        }

        .brand-title { font-size: 1.35rem; font-weight: 700; margin: 0 0 4px; }
        .brand-subtitle { font-size: 0.85rem; color: var(--text-secondary); margin: 0; }

        .field-group { margin-bottom: 14px; }

        .field-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .field-hint { font-size: 0.72rem; font-weight: 500; color: var(--text-muted); }

        .input-wrapper { position: relative; display: flex; align-items: center; }

        .leading-icon {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 0.88rem;
            pointer-events: none;
        }

        .form-input, .form-textarea {
            width: 100%;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-primary);
            background: #fff;
            border: 1.5px solid var(--border-color);
            border-radius: 11px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-input { height: 43px; padding: 0 14px 0 40px; }
        .form-textarea { padding: 10px 14px 10px 40px; min-height: 76px; resize: vertical; }

        .form-input:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3.5px var(--focus-ring);
        }

        .btn-submit {
            width: 100%;
            height: 45px;
            margin-top: 6px;
            border: none;
            border-radius: 11px;
            background: var(--primary);
            color: #fff;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-submit:hover { background: var(--primary-hover); }

        .card-footer-links {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            font-size: 0.82rem;
        }

        .footer-link { color: var(--text-secondary); text-decoration: none; font-weight: 500; }
        .footer-link:hover, .footer-link-primary { color: var(--primary); font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>
    <main class="form-container">
        <section class="form-card">
            <div class="brand-header">
                <div class="brand-logo"><i class="fa-solid fa-user-plus"></i></div>
                <h1 class="brand-title">Register Customer</h1>
                <p class="brand-subtitle">Add a customer under your distributor account</p>
            </div>

            <div id="alertBox" class="alert d-none rounded-3 py-2 px-3 small mb-3" role="alert"></div>

            <form id="customerForm" novalidate>
                {% csrf_token %}

                <div class="field-group">
                    <label for="name" class="field-label"><span>Customer Name</span><span class="field-hint">Required</span></label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user leading-icon"></i>
                        <input type="text" id="name" name="name" class="form-input" placeholder="e.g. Rajesh Traders" required>
                    </div>
                </div>

                <div class="field-group">
                    <label for="phone" class="field-label"><span>Phone Number</span><span class="field-hint">Required</span></label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-phone leading-icon"></i>
                        <input type="text" id="phone" name="phone" maxlength="15" class="form-input" placeholder="e.g. 9876543210" required>
                    </div>
                </div>

                <div class="field-group">
                    <label for="email" class="field-label"><span>Email</span><span class="field-hint">Optional</span></label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope leading-icon"></i>
                        <input type="email" id="email" name="email" class="form-input" placeholder="customer@example.com">
                    </div>
                </div>

                <div class="field-group">
                    <label for="address" class="field-label"><span>Address</span><span class="field-hint">Optional</span></label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-location-dot leading-icon" style="top: 13px;"></i>
                        <textarea id="address" name="address" class="form-textarea" placeholder="Shop / street / city"></textarea>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">Save Customer</button>
            </form>

            <div class="card-footer-links">
                <a href="{% url 'customer_list' %}" class="footer-link-primary">Customer List</a>
                <a href="{% url 'dashboard' %}" class="footer-link">Back to Dashboard</a>
            </div>
        </section>
    </main>

    <script>
        (function () {
            const form = document.getElementById("customerForm");
            const alertBox = document.getElementById("alertBox");
            const submitBtn = document.getElementById("submitBtn");
            const csrfToken = document.querySelector("[name=csrfmiddlewaretoken]").value;

            function showAlert(type, msg) {
                alertBox.className = `alert alert-${type} rounded-3 py-2 px-3 small mb-3`;
                alertBox.textContent = msg;
            }

            form.addEventListener("submit", async function (e) {
                e.preventDefault();
                submitBtn.disabled = true;
                submitBtn.textContent = "Saving...";

                const payload = {
                    name: document.getElementById("name").value.trim(),
                    phone: document.getElementById("phone").value.trim(),
                    email: document.getElementById("email").value.trim(),
                    address: document.getElementById("address").value.trim(),
                };

                try {
                    const res = await fetch("{% url 'api_customer_register' %}", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "X-CSRFToken": csrfToken,
                        },
                        body: JSON.stringify(payload),
                    });
                    const data = await res.json();

                    if (res.ok && data.success) {
                        showAlert("success", data.message || "Customer registered successfully.");
                        form.reset();
                    } else {
                        showAlert("danger", data.error || "Could not register customer.");
                    }
                } catch (err) {
                    showAlert("danger", "Network error while saving customer.");
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Save Customer";
                }
            });
        })();
    </script>
</body>
</html>
