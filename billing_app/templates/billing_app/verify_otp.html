<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify OTP | Advance Billing System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .auth-card { border: none; border-radius: 22px; box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08); }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">

<div class="card auth-card p-4 p-md-5 bg-white" style="max-width: 460px; width: 100%;">
    <h3 class="fw-bold text-dark mb-1">Verify OTP &amp; Reset Password</h3>
    <p class="text-muted small mb-4">Account: <strong>{{ user_obj.email|default:user_obj.username }}</strong></p>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %} rounded-4 py-2 px-3">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <!-- Verify OTP & Reset Password Form -->
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label fw-semibold small">6-Digit OTP *</label>
            <input type="text" name="otp" maxlength="6" pattern="[0-9]{6}" class="form-control rounded-3" placeholder="Enter 6-digit OTP" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold small">New Password *</label>
            <input type="password" name="new_password" minlength="6" class="form-control rounded-3" placeholder="At least 6 characters" required>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold small">Confirm New Password *</label>
            <input type="password" name="confirm_password" minlength="6" class="form-control rounded-3" placeholder="Re-enter new password" required>
        </div>

        <div class="d-grid gap-2">
            <button type="submit" name="action" value="verify" class="btn btn-primary rounded-pill py-2 fw-semibold">
                Verify OTP &amp; Reset Password
            </button>
        </div>
    </form>

    <!-- Resend OTP Form -->
    <form method="post" class="mt-3 d-grid">
        {% csrf_token %}
        <button type="submit" name="action" value="resend" class="btn btn-outline-primary rounded-pill py-2 fw-semibold">
            Resend OTP
        </button>
    </form>

    <div class="text-center mt-3">
        <a href="{% url 'send_otp' %}" class="small text-decoration-none text-muted">Change Email</a> &bull;
        <a href="{% url 'login' %}" class="small text-decoration-none text-muted">Back to Login</a>
    </div>
</div>

</body>
</html>
