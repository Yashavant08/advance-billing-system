<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Advance Billing System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            min-height: 100vh;
        }
        .auth-card { 
            border: none; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08); 
            background: #ffffff; 
        }
        .icon-badge {
            width: 64px;
            height: 64px;
            background: #e0f2fe;
            color: #0284c7;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            font-size: 24px;
            box-shadow: 0 8px 16px rgba(2, 132, 199, 0.15);
        }
        .form-control {
            background-color: #f8fafc;
            border: 1.5px solid #e2e8f0;
            padding: 12px 18px;
            font-size: 0.95rem;
        }
        .form-control:focus {
            background-color: #fff;
            border-color: #0284c7;
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.1);
        }
        .btn-primary-custom {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            border: none;
            padding: 12px;
            font-weight: 600;
            border-radius: 50rem;
            transition: all 0.3s ease;
        }
        .btn-primary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.3);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center py-5">

    <div class="card auth-card p-4 p-md-5" style="max-width: 440px; width: 100%;">
        
        <!-- Top Icon Badge -->
        <div class="icon-badge">
            <i class="fa-solid fa-lock"></i>
        </div>

        <div class="text-center mb-4">
            <h3 class="fw-bold text-dark mb-1">Welcome Back!</h3>
            <p class="text-muted small">Sign in to your distributor billing account</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show rounded-4 small py-2" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-medium text-secondary small">Email Address</label>
                <div class="input-group">
                    <input type="email" name="email" class="form-control rounded-pill px-4" placeholder="name@example.com" required>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-medium text-secondary small">Password</label>
                <input type="password" name="password" class="form-control rounded-pill px-4" placeholder="••••••••" required>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4 small">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label text-muted" for="rememberMe">Remember me</label>
                </div>
                <a href="{% url 'send_otp' %}" class="text-decoration-none text-primary fw-medium">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 text-white mb-4">Login Account</button>
        </form>

        <div class="text-center border-top pt-3">
            <p class="text-muted small mb-0">Don't have an account? <a href="{% url 'register' %}" class="text-decoration-none fw-semibold text-primary">Create Account</a></p>
        </div>
    </div>

</body>
</html>
