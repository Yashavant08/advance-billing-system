<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Distributor Profile | Advance Billing System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #1e293b; }
        .profile-card { border: none; border-radius: 22px; box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08); }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">

<div class="card profile-card p-4 p-md-5 bg-white" style="max-width: 520px; width: 100%;">
    <div class="d-flex justify-content-between align-items-start mb-4">
        <div>
            <h3 class="fw-bold text-dark mb-1">Distributor Profile</h3>
            <p class="text-muted small mb-0">View and update your account details</p>
        </div>
        {% if profile.is_verified %}
            <span class="badge bg-success-subtle text-success rounded-pill px-3 py-2">Verified</span>
        {% else %}
            <span class="badge bg-warning-subtle text-warning-emphasis rounded-pill px-3 py-2">Unverified</span>
        {% endif %}
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %} rounded-4 py-2 px-3">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="post" novalidate>
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label fw-semibold small">Full Name *</label>
            <input type="text" name="name" value="{{ form_data.name }}" class="form-control rounded-3" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold small">Email Address *</label>
            <input type="email" name="email" value="{{ form_data.email }}" class="form-control rounded-3" required>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold small">Phone Number *</label>
            <input type="text" name="phone" value="{{ form_data.phone }}" class="form-control rounded-3" required>
        </div>

        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary rounded-pill py-2 fw-semibold">Update Profile</button>
            <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary rounded-pill py-2 fw-semibold">Back to Dashboard</a>
        </div>
    </form>
</div>

</body>
</html>
