<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | Advance Billing System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1d4ed8;
            --primary-hover: #1e40af;
            --primary-soft: #eff6ff;
            --surface: #ffffff;
            --bg-canvas: #f8fafc;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --focus-ring: rgba(29, 78, 216, 0.14);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-canvas);
            background-image:
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.10) 0px, transparent 50%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            color: var(--text-primary);
        }

        .change-container {
            width: 100%;
            max-width: 440px;
        }

        .change-card {
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 32px 28px;
            box-shadow:
                0 10px 25px -5px rgba(15, 23, 42, 0.06),
                0 4px 10px -6px rgba(15, 23, 42, 0.04);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 22px;
        }

        .brand-logo {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: var(--primary-soft);
            color: var(--primary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-bottom: 14px;
            border: 1px solid rgba(29, 78, 216, 0.12);
        }

        .brand-title {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 0 0 6px;
        }

        .brand-subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin: 0;
        }

        .field-group {
            margin-bottom: 15px;
        }

        .field-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .field-hint {
            font-size: 0.72rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .leading-icon {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 0.88rem;
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            height: 44px;
            padding: 0 42px 0 40px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-primary);
            background-color: #ffffff;
            border: 1.5px solid var(--border-color);
            border-radius: 11px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3.5px var(--focus-ring);
        }

        .trailing-btn {
            position: absolute;
            right: 10px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            width: 30px;
            height: 30px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .trailing-btn:hover {
            background-color: #f1f5f9;
            color: var(--text-primary);
        }

        .btn-submit {
            width: 100%;
            height: 45px;
            margin-top: 6px;
            border: none;
            border-radius: 11px;
            background-color: var(--primary);
            color: #ffffff;
            font-size: 0.92rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .card-footer-links {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 0.82rem;
        }

        .footer-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
        }

        .footer-link:hover {
            color: var(--primary);
        }

        .footer-link-primary {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }

        .footer-link-primary:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main class="change-container">
        <section class="change-card" aria-label="Change password form">
            <div class="brand-header">
                <div class="brand-logo">
                    <i class="fa-solid fa-lock-open"></i>
                </div>
                <h1 class="brand-title">Change password</h1>
                <p class="brand-subtitle">Enter your current password to set a new one</p>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show rounded-3 py-2 px-3 small mb-3" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close btn-close-sm" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" novalidate>
                {% csrf_token %}

                <div class="field-group">
                    <label for="current_password" class="field-label">
                        <span>Current Password</span>
                    </label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-key leading-icon"></i>
                        <input
                            type="password"
                            id="current_password"
                            name="current_password"
                            class="form-input"
                            placeholder="Enter current password"
                            autocomplete="current-password"
                            autofocus
                            required
                        >
                        <button type="button" class="trailing-btn" data-target="current_password" aria-label="Toggle password">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="field-group">
                    <label for="new_password" class="field-label">
                        <span>New Password</span>
                        <span class="field-hint">Min 6 chars</span>
                    </label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock leading-icon"></i>
                        <input
                            type="password"
                            id="new_password"
                            name="new_password"
                            class="form-input"
                            placeholder="Enter new password"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >
                        <button type="button" class="trailing-btn" data-target="new_password" aria-label="Toggle password">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="field-group">
                    <label for="confirm_password" class="field-label">
                        <span>Confirm New Password</span>
                    </label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-check-double leading-icon"></i>
                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            class="form-input"
                            placeholder="Re-enter new password"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >
                        <button type="button" class="trailing-btn" data-target="confirm_password" aria-label="Toggle password">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    <span>Update Password</span>
                    <i class="fa-solid fa-arrow-right small"></i>
                </button>
            </form>

            <div class="card-footer-links">
                <a href="{% url 'forgot_password' %}" class="footer-link-primary">
                    Forgot old password?
                </a>
                <a href="{% url 'dashboard' %}" class="footer-link">
                    Back to Dashboard
                </a>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function () {
            document.querySelectorAll(".trailing-btn[data-target]").forEach(function (btn) {
                btn.addEventListener("click", function () {
                    const input = document.getElementById(btn.getAttribute("data-target"));
                    const icon = btn.querySelector("i");
                    if (!input || !icon) return;
                    const show = input.type === "password";
                    input.type = show ? "text" : "password";
                    icon.className = show ? "fa-regular fa-eye-slash" : "fa-regular fa-eye";
                });
            });
        })();
    </script>
</body>
</html>
