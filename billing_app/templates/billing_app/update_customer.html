<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Customer | Advance Billing System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5 d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5" style="max-width: 500px; width: 100%;">
        <h3 class="fw-bold text-dark mb-4 text-center">Edit Customer Info</h3>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-medium">Customer Name</label>
                <input type="text" name="name" value="{{ customer.name }}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-medium">Email Address</label>
                <input type="email" name="email" value="{{ customer.email|default:'' }}" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label fw-medium">Phone Number</label>
                <input type="text" name="phone" value="{{ customer.phone }}" class="form-control" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-medium">Address</label>
                <textarea name="address" class="form-control" rows="3">{{ customer.address|default:'' }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-semibold">Update Customer</button>
            <a href="{% url 'customer_list' %}" class="btn btn-light w-100 mt-2 py-2 rounded-pill text-muted">Cancel</a>
        </form>
    </div>
</body>
</html>
