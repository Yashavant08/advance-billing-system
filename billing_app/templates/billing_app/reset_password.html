<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Advance Billing System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1d4ed8;
            --primary-hover: #1e40af;
            --primary-soft: #eff6ff;
            --surface: #ffffff;
            --bg-canvas: #f8fafc;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --focus-ring: rgba(29, 78, 216, 0.14);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-canvas);
            background-image:
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.10) 0px, transparent 50%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            color: var(--text-primary);
        }

        .reset-container {
            width: 100%;
            max-width: 440px;
        }

        .reset-card {
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 32px 28px;
            box-shadow:
                0 10px 25px -5px rgba(15, 23, 42, 0.06),
                0 4px 10px -6px rgba(15, 23, 42, 0.04);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 22px;
        }

        .brand-logo {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: var(--primary-soft);
            color: var(--primary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-bottom: 14px;
            border: 1px solid rgba(29, 78, 216, 0.12);
        }

        .brand-title {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 0 0 6px;
            color: var(--text-primary);
        }

        .brand-subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin: 0;
            word-break: break-word;
        }

        .recipient-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            padding: 4px 10px;
            border-radius: 999px;
            background: #f1f5f9;
            color: var(--text-primary);
            font-size: 0.78rem;
            font-weight: 600;
        }

        .field-group {
            margin-bottom: 15px;
        }

        .field-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .field-hint {
            font-size: 0.72rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .leading-icon {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 0.88rem;
            pointer-events: none;
            transition: color 0.2s ease;
        }

        .form-input {
            width: 100%;
            height: 44px;
            padding: 0 42px 0 40px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-primary);
            background-color: #ffffff;
            border: 1.5px solid var(--border-color);
            border-radius: 11px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .otp-input {
            letter-spacing: 0.28em;
            font-weight: 700;
        }

        .form-input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: normal;
        }

        .form-input:hover {
            border-color: #cbd5e1;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3.5px var(--focus-ring);
        }

        .input-wrapper:focus-within .leading-icon {
            color: var(--primary);
        }

        .trailing-btn {
            position: absolute;
            right: 10px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            width: 30px;
            height: 30px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .trailing-btn:hover {
            background-color: #f1f5f9;
            color: var(--text-primary);
        }

        .caps-warning {
            display: none;
            font-size: 0.76rem;
            color: #b45309;
            background: #fffbeb;
            border: 1px solid #fde68a;
            border-radius: 8px;
            padding: 5px 10px;
            margin-top: 7px;
        }

        .caps-warning.active {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .match-feedback {
            font-size: 0.74rem;
            margin-top: 5px;
            display: none;
        }

        .match-feedback.visible {
            display: block;
        }

        .btn-submit {
            width: 100%;
            height: 45px;
            margin-top: 6px;
            border: none;
            border-radius: 11px;
            background-color: var(--primary);
            color: #ffffff;
            font-size: 0.92rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.12s ease, box-shadow 0.2s ease;
        }

        .btn-submit:hover:not(:disabled) {
            background-color: var(--primary-hover);
            box-shadow: 0 8px 18px -6px rgba(29, 78, 216, 0.45);
        }

        .btn-submit:active:not(:disabled) {
            transform: scale(0.99);
        }

        .btn-submit:disabled {
            opacity: 0.75;
            cursor: not-allowed;
        }

        .card-footer-links {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 0.82rem;
        }

        .footer-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .footer-link:hover {
            color: var(--primary);
        }

        .footer-link-primary {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }

        .footer-link-primary:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main class="reset-container">
        <section class="reset-card" aria-label="Reset password form">
            <div class="brand-header">
                <div class="brand-logo">
                    <i class="fa-solid fa-key"></i>
                </div>
                <h1 class="brand-title">Reset your password</h1>
                <p class="brand-subtitle">Verify your OTP and choose a new password</p>
                {% if recovery_email %}
                    <div class="recipient-badge">
                        <i class="fa-regular fa-envelope"></i>
                        <span>{{ recovery_email }}</span>
                    </div>
                {% endif %}
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show rounded-3 py-2 px-3 small mb-3" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close btn-close-sm" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" id="resetPasswordForm" novalidate>
                {% csrf_token %}

                <div class="field-group">
                    <label for="otp" class="field-label">
                        <span>6-Digit OTP</span>
                        <span class="field-hint">Check email / console</span>
                    </label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-shield-keyhole leading-icon"></i>
                        <input
                            type="text"
                            id="otp"
                            name="otp"
                            class="form-input otp-input"
                            inputmode="numeric"
                            pattern="[0-9]{6}"
                            maxlength="6"
                            placeholder="000000"
                            autocomplete="one-time-code"
                            autofocus
                            required
                        >
                    </div>
                </div>

                <div class="field-group">
                    <label for="new_password" class="field-label">
                        <span>New Password</span>
                        <span class="field-hint">Min 6 chars</span>
                    </label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock leading-icon"></i>
                        <input
                            type="password"
                            id="new_password"
                            name="new_password"
                            class="form-input"
                            placeholder="Enter new password"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >
                        <button
                            type="button"
                            class="trailing-btn"
                            id="toggleNewPasswordBtn"
                            aria-label="Show or hide new password"
                        >
                            <i class="fa-regular fa-eye" id="toggleNewPasswordIcon"></i>
                        </button>
                    </div>
                    <div class="caps-warning" id="capsLockWarning">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        <span>Caps Lock is on</span>
                    </div>
                </div>

                <div class="field-group">
                    <label for="confirm_password" class="field-label">
                        <span>Confirm New Password</span>
                    </label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-check-double leading-icon"></i>
                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            class="form-input"
                            placeholder="Re-enter new password"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >
                        <button
                            type="button"
                            class="trailing-btn"
                            id="toggleConfirmPasswordBtn"
                            aria-label="Show or hide confirm password"
                        >
                            <i class="fa-regular fa-eye" id="toggleConfirmPasswordIcon"></i>
                        </button>
                    </div>
                    <span class="match-feedback" id="passwordMatchMsg"></span>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <span id="submitBtnText">Update Password</span>
                    <i class="fa-solid fa-arrow-right small" id="submitBtnIcon"></i>
                </button>
            </form>

            <div class="card-footer-links">
                <a href="{% url 'forgot_password' %}" class="footer-link">
                    <i class="fa-solid fa-rotate-right"></i>
                    <span>Resend OTP</span>
                </a>
                <a href="{% url 'login' %}" class="footer-link-primary">
                    Back to Sign In
                </a>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function () {
            function bindToggle(btnId, inputId, iconId) {
                const btn = document.getElementById(btnId);
                const input = document.getElementById(inputId);
                const icon = document.getElementById(iconId);
                if (btn && input && icon) {
                    btn.addEventListener("click", function () {
                        const shouldShow = input.type === "password";
                        input.type = shouldShow ? "text" : "password";
                        icon.className = shouldShow ? "fa-regular fa-eye-slash" : "fa-regular fa-eye";
                    });
                }
            }

            bindToggle("toggleNewPasswordBtn", "new_password", "toggleNewPasswordIcon");
            bindToggle("toggleConfirmPasswordBtn", "confirm_password", "toggleConfirmPasswordIcon");

            const otpInput = document.getElementById("otp");
            if (otpInput) {
                otpInput.addEventListener("input", function () {
                    otpInput.value = otpInput.value.replace(/\D/g, "").slice(0, 6);
                });
            }

            const newPwd = document.getElementById("new_password");
            const confirmPwd = document.getElementById("confirm_password");
            const matchMsg = document.getElementById("passwordMatchMsg");
            const capsWarning = document.getElementById("capsLockWarning");

            function updateMatchState() {
                if (!newPwd || !confirmPwd || !matchMsg) return;
                if (!confirmPwd.value) {
                    matchMsg.classList.remove("visible");
                    matchMsg.textContent = "";
                    return;
                }
                matchMsg.classList.add("visible");
                if (newPwd.value === confirmPwd.value) {
                    matchMsg.textContent = "Passwords match";
                    matchMsg.style.color = "#059669";
                } else {
                    matchMsg.textContent = "Passwords do not match";
                    matchMsg.style.color = "#dc2626";
                }
            }

            if (newPwd && confirmPwd) {
                newPwd.addEventListener("input", updateMatchState);
                confirmPwd.addEventListener("input", updateMatchState);
            }

            [newPwd, confirmPwd].forEach(function (el) {
                if (!el || !capsWarning) return;
                function checkCaps(e) {
                    if (typeof e.getModifierState === "function") {
                        capsWarning.classList.toggle("active", e.getModifierState("CapsLock"));
                    }
                }
                el.addEventListener("keyup", checkCaps);
                el.addEventListener("keydown", checkCaps);
                el.addEventListener("blur", function () {
                    capsWarning.classList.remove("active");
                });
            });

            const form = document.getElementById("resetPasswordForm");
            const submitBtn = document.getElementById("submitBtn");
            const submitBtnText = document.getElementById("submitBtnText");
            const submitBtnIcon = document.getElementById("submitBtnIcon");

            if (form && submitBtn) {
                form.addEventListener("submit", function () {
                    submitBtn.disabled = true;
                    if (submitBtnText) submitBtnText.textContent = "Updating...";
                    if (submitBtnIcon) submitBtnIcon.className = "fa-solid fa-circle-notch fa-spin small";
                });
            }
        })();
    </script>
</body>
</html>
